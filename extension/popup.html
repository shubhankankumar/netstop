<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetStop</title>
  <meta name="description" content="What this laptop sent and received on one day, by program.">
  <link rel="stylesheet" href="app.css">
</head>
<body class="popup">
  <header class="bar">
    <button class="key icon" id="prev" type="button" aria-label="Earlier day" title="Earlier day">‹</button>
    <div class="title"><span class="brand">NetStop</span><h1 id="day">Today</h1></div>
    <button class="key icon" id="next" type="button" aria-label="Later day" title="Later day">›</button>
  </header>
  <main id="main" aria-live="polite">
    <div class="state skeleton"><span></span><span></span><span></span></div>
  </main>
  <footer class="foot">
    <p class="status" id="status"></p>
    <button class="key primary" id="open" type="button">Open full report</button>
  </footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
