[package]
name = "netstop"
version = "1.0.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = "0.37.0"
ferrisetw = "1.2.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Services", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Console", "Win32_System_RemoteDesktop","Win32_Security", "Win32_Security_Authorization", "Win32_Networking_WinSock"] }

[profile.release]
opt-level = 3
incremental = true # rebuilds redo only what changed
panic = "abort"
strip = true

# Published downloads: `cargo build --profile dist` (slow, smaller exe). Day-to-day builds use release.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
incremental = false

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
